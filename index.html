
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Candimate</title>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#1a8fa0"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<!-- Vùng nhận hover để hiện lại sidebar khi auto-hide -->
<div id="sidebar-edge-trigger"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

  <!-- Logo = Home button (ẩn trên mobile qua CSS) -->
  <button class="sb-logo-btn" onclick="scrollToTop()" title="Candimate — Về đầu trang">
    <img id="sb-logo-img" src="/lightmode-icon.png" alt="Candimate"/>
  </button>

  <button class="sb-btn" id="sb-search" title="Tìm kiếm" onclick="toggleSbPanel()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>

  <button class="sb-btn" id="sb-home" title="Trang chính" onclick="scrollToTop()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>

  <button class="sb-btn" id="sb-albums" title="Albums" onclick="openAlbumsPage()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
  </button>

  <div class="sb-spacer"></div>

  <a class="sb-btn sb-upload-btn" id="sb-upload" title="Upload ảnh" href="https://tally.so/r/xXZWEJ" target="_blank" rel="noopener">
    <svg fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </a>

  <button class="sb-btn sb-account-btn" id="sb-account" title="Tài khoản" onclick="toggleAccountPanel()">
    <img id="sb-account-avatar" alt="" style="display:none;"/>
    <svg id="sb-account-fallback" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </button>

  <button class="sb-btn" id="music-btn" title="Nhạc nền" onclick="toggleMusicPicker()">
    <svg id="icon-play" fill="currentColor" viewBox="0 0 24 24"><path d="M9 4l12 8-12 8V4z"/></svg>
    <svg id="icon-pause" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <button class="sb-btn" id="sb-logout" title="Đăng xuất" onclick="cm_signOut()">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  </button>

</aside>

<!-- SETTINGS TRIGGER — góc trên-phải màn hình, tròn, hover hiện chữ "Settings" -->
<button class="topright-settings-btn" id="topright-settings-btn" onclick="toggleSettings()">
  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  <span class="topright-settings-label">Settings</span>
</button>

<!-- ACCOUNT PANEL (avatar + tên trên cùng, bookmark bên dưới) -->
<div class="settings-popup" id="account-popup">
  <div class="settings-header">
    <div class="settings-title" style="margin:0;">Tài khoản</div>
    <button class="settings-close-btn" onclick="closeAccountPanel()">✕</button>
  </div>

  <div class="account-header">
    <img id="account-avatar-lg" class="account-avatar-lg" alt="" style="display:none;"/>
    <svg id="account-avatar-fallback" class="account-avatar-lg account-avatar-fallback" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <div class="account-header-text">
      <div class="account-name" id="account-name">—</div>
      <div class="account-email" id="account-email"></div>
    </div>
  </div>

  <div class="settings-divider"></div>
  <p class="settings-section-title">Đã lưu</p>
  <div id="account-fav-list" class="account-fav-list"></div>
</div>

<!-- SETTINGS DRAWER (mép trái, full-height) -->
<div class="settings-popup" id="settings-popup">
  <div class="settings-header">
    <div class="settings-title" style="margin:0;">Cài đặt</div>
    <button class="settings-close-btn" onclick="closeSettings()">✕</button>
  </div>

  <div class="settings-row">
    <label for="dark-toggle">Dark mode</label>
    <label class="toggle-switch"><input type="checkbox" id="dark-toggle" onchange="applyTheme(this.checked)"/><span class="toggle-track"></span></label>
  </div>
  <div class="settings-row">
    <label for="autoplay-toggle">Tự phát nhạc</label>
    <label class="toggle-switch"><input type="checkbox" id="autoplay-toggle" onchange="setAutoplay(this.checked)"/><span class="toggle-track"></span></label>
  </div>
  <div class="settings-row" id="rightsb-row">
    <label for="rightsb-toggle">Sidebar phải</label>
    <label class="toggle-switch"><input type="checkbox" id="rightsb-toggle" onchange="setSidebarRight(this.checked)"/><span class="toggle-track"></span></label>
  </div>
  <div class="settings-row" id="autohide-row">
    <label for="autohide-toggle">Tự động ẩn thanh bên</label>
    <label class="toggle-switch"><input type="checkbox" id="autohide-toggle" onchange="setAutoHideSidebar(this.checked)"/><span class="toggle-track"></span></label>
  </div>
  <div class="settings-row" id="perfsaver-row">
    <label for="perfsaver-toggle">Chế độ tiết kiệm hiệu năng</label>
    <label class="toggle-switch"><input type="checkbox" id="perfsaver-toggle" onchange="setPerfSaver(this.checked)"/><span class="toggle-track"></span></label>
  </div>

  <div class="settings-divider"></div>
  <p class="settings-section-title">Ảnh nền</p>
  <p class="wallpaper-picker-note" id="wallpaper-note">Ảnh nền đang tắt do Chế độ tiết kiệm hiệu năng đang bật.</p>
  <div class="wallpaper-grid" id="wallpaper-grid"></div>

  <div class="settings-divider"></div>
  <a class="settings-about-link" href="https://candimate.pages.dev/policies" target="_blank" rel="noopener">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/></svg>
    Về dự án này
    <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
  </a>
</div>

<!-- MUSIC PICKER (Modal) -->
<div class="music-picker center-modal" id="music-picker">
  <div class="music-picker-inner">
  <div class="modal-header">
    <span class="modal-title">🎵 Chọn nhạc nền</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="modal-close" id="music-playpause-btn" onclick="toggleMusic()" title="Phát/Dừng" style="width:32px;height:32px;">
        <svg id="mp-icon-play" width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M9 4l12 8-12 8V4z"/></svg>
        <svg id="mp-icon-pause" width="14" height="14" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="modal-close" onclick="toggleMusicPicker()">✕</button>
    </div>
  </div>
  <div class="music-track active" id="track-0" onclick="selectTrack(0)">
    <div class="music-track-icon">🌤️</div>
    <div class="music-track-info"><div class="music-track-name">Trời Hửng Nắng</div><div class="music-track-artist">Uông Tô Lang</div></div>
    <div class="music-track-playing"><span></span><span></span><span></span></div>
  </div>  
  <div class="music-track" id="track-1" onclick="selectTrack(1)">
    <div class="music-track-icon">🌌</div>
    <div class="music-track-info"><div class="music-track-name">Call of Silence - Clear Sky remix</div><div class="music-track-artist">Don't know</div></div>
    <div class="music-track-playing"><span></span><span></span><span></span></div>
  </div>
  <div class="music-track" id="track-2" onclick="selectTrack(2)">
    <div class="music-track-icon">💙</div>
    <div class="music-track-info"><div class="music-track-name">Một đời (Solo violin)</div><div class="music-track-artist">14 Casper</div></div>
    <div class="music-track-playing"><span></span><span></span><span></span></div>
  </div>
  <div class="music-picker-footer">
    <button class="repeat-btn" id="repeat-all-btn" onclick="setRepeatMode('all')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>Lặp tất cả
    </button>
    <button class="repeat-btn" id="repeat-one-btn" onclick="setRepeatMode('one')">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="10" y1="10" x2="12" y2="8"/></svg>Lặp 1 bài
    </button>
  </div>
  </div>
</div>

<!-- OVERLAY DÙNG CHUNG cho Search / AI / Music -->
<div class="modal-overlay" id="modal-overlay" onclick="closeAllModals()"></div>

<!-- SEARCH PANEL (Modal) -->
<div class="sb-panel center-modal" id="sb-panel">
  <div class="sb-panel-inner">
    <div class="modal-header" style="padding:0 0 14px; margin-bottom:14px;">
      <span class="modal-title">Tìm kiếm</span>
      <button class="modal-close" onclick="toggleSbPanel()">✕</button>
    </div>
    <div class="sb-search-box">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="sb-search-input" placeholder="Nhập tên ảnh..." autocomplete="off"/>
    </div>
    <div id="sb-suggestions" class="sb-suggestions">
      <p class="sb-suggest-label">Dành Cho Bạn</p>
      <div class="sb-suggest-list" id="sb-suggest-list"></div>
    </div>
    <div class="sb-search-results" id="sb-results" style="display:none"></div>
  </div>
</div>

<!-- ALBUMS (rendered by JS) -->
<div id="albums-container"></div>

<!-- LIGHTBOX -->
<div id="lightbox">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <div class="lb-img-wrap">
    <button class="lb-nav lb-prev" onclick="navLb(-1)">‹</button>
    <img id="lb-img" src="" alt=""/>
    <button class="lb-nav lb-next" onclick="navLb(1)">›</button>
  </div>
  <div class="lb-bar">
    <span id="lb-name"></span>
    <span id="lb-counter"></span>
    <div class="lb-info-wrap">
      <button class="lb-btn" id="info-btn" onclick="toggleInfoPopup()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="8"/><line x1="12" y1="12" x2="12" y2="16"/></svg> Thông tin
      </button>
      <div class="lb-info-popup" id="lb-info-popup"></div>
    </div>
    <button class="lb-zoom-btn" id="zoom-btn" onclick="toggleZoom()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg> Phóng to
    </button>
    <button class="lb-btn" id="lb-fav-btn" onclick="toggleFavoriteCurrentPhoto()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> Yêu thích
    </button>
    <a id="lb-download" href="#" download>
      <button class="lb-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Tải ảnh
      </button>
    </a>
  </div>
</div>

<audio id="bg-audio" loop></audio>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/auth.js"></script>
<script>
  // Đồng bộ lại cookie phòng khi token vừa được auto-refresh trong lúc tab đang mở.
  // Nếu vì lý do gì đó không còn session hợp lệ (bị thu hồi...), đá về welcome.
  cm_ensureCookieSynced().then(session => {
    if (!session) { window.location.href = '/welcome.html'; return; }
    cm_getUserInfo().then(info => {
      if (!info) return;
      const sbImg = document.getElementById('sb-account-avatar');
      const sbFallback = document.getElementById('sb-account-fallback');
      const bigImg = document.getElementById('account-avatar-lg');
      const bigFallback = document.getElementById('account-avatar-fallback');
      if (info.avatarUrl) {
        sbImg.src = info.avatarUrl; sbImg.style.display = 'block';
        sbFallback.style.display = 'none';
        bigImg.src = info.avatarUrl; bigImg.style.display = 'block';
        bigFallback.style.display = 'none';
      }
      document.getElementById('account-name').textContent = info.name;
      document.getElementById('account-email').textContent = info.email;
      document.getElementById('sb-account').title = info.name;
    });
  });
</script>
<script src="js/app.js"></script>
</body>
</html>
