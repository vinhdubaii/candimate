name: Update theme manifest

# Tự động chạy mỗi khi có thay đổi trong folder themes/
# Bạn chỉ cần thêm/xoá ảnh .webp (hoặc .jpg/.png) vào themes/ rồi push —
# Action sẽ tự quét và cập nhật themes/manifest.json, không cần đụng code.

on:
  push:
    paths:
      - 'themes/**'
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate themes/manifest.json
        run: |
          cd themes
          python3 - <<'PY'
          import json, os

          exts = ('.webp', '.jpg', '.jpeg', '.png')
          files = sorted(
              f for f in os.listdir('.')
              if f.lower().endswith(exts) and os.path.isfile(f)
          )
          with open('manifest.json', 'w', encoding='utf-8') as fp:
              json.dump(files, fp, ensure_ascii=False, indent=2)
          print(f"Found {len(files)} wallpaper(s): {files}")
          PY

      - name: Commit changes (nếu có)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add themes/manifest.json
          git diff --cached --quiet && echo "Không có gì thay đổi" || git commit -m "chore: auto-update themes/manifest.json"
          git push
