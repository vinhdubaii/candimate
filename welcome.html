<style>
  :root{
    --red:#FF3333;
    --indigo:#3139FB;
    --blue:#0047FF;
    --cream:#FFFADD;
    --black:#050507;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--black);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    overflow:hidden;
  }

  /* ---------- STAGE ---------- */
  #stage{
    position:fixed;
    inset:0;
    background:var(--black);
    z-index:20;
    transition:opacity .7s ease;
  }
  #stage.hide{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- START OVERLAY ---------- */
  #startOverlay{
    position:absolute;
    inset:0;
    z-index:30;
    background:var(--black);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    transition:opacity .5s ease;
  }
  #startOverlay.hide{
    opacity:0;
    pointer-events:none;
  }
  /* Khoá cứng mọi phần tử con (kể cả startBtn.ready tự bật pointer-events
     riêng) để không đè và chặn click của các nút phía sau, ví dụ #nextBtn. */
  #startOverlay.hide *{
    pointer-events:none !important;
  }
  .start-orb{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6c86ff, var(--indigo) 45%, var(--blue) 75%, transparent 78%);
    filter:blur(1px);
    box-shadow:0 0 40px 10px rgba(49,57,251,.55);
    animation:orbBreatheSmall 2.6s ease-in-out infinite;
  }
  @keyframes orbBreatheSmall{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.15);}
  }
  #turnstileHeading{
    color:var(--cream);
    font-size:15px;
    font-weight:700;
    letter-spacing:.02em;
    text-align:center;
    opacity:.9;
  }
  #startBtn{
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--black);
    background:var(--cream);
    border:none;
    border-radius:999px;
    padding:13px 28px;
    cursor:pointer;
    opacity:0;
    transform:translateY(6px) scale(.96);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease, box-shadow .25s ease;
  }
  #startBtn.ready{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  #startBtn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,250,221,.18);
  }
  #startBtn:active{
    transform:translateY(0px) scale(.97);
  }

  /* ---------- MADE BY FOOTER (đáy màn hình check bot) ---------- */
  #madeByFooter{
    position:absolute;
    left:0;
    right:0;
    bottom:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .made-by-label{
    font-size:12px;
    font-weight:500;
    color:rgba(255,250,221,.5);
    letter-spacing:.02em;
  }
  .made-by-link{
    display:flex;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--cream);
    font-size:13px;
    font-weight:700;
    opacity:.85;
    transition:opacity .2s ease;
  }
  .made-by-link:hover{
    opacity:1;
  }
  .made-by-avatar{
    width:22px;
    height:22px;
    border-radius:50%;
    display:block;
    object-fit:cover;
    box-shadow:0 0 0 1px rgba(255,250,221,.25);
  }

  /* ---------- PHASE 1: blended breathing orb ---------- */
  #introOrb{
    position:absolute;
    top:50%; left:50%;
    width:126px;
    height:126px;
    margin:-63px 0 0 -63px;
    border-radius:58% 42% 55% 45% / 45% 55% 45% 55%;
    overflow:hidden;
    filter:blur(7px);
    opacity:0;
    z-index:5;
    background:radial-gradient(circle, #1c1fb0, #0047FF 80%);
    box-shadow:0 0 50px 14px rgba(49,57,251,.35);
  }
  #introOrb.breathe{
    opacity:1;
    animation:orbFloat 8.4s ease-in-out infinite, blobMorph 5.2s ease-in-out infinite;
  }
  #introOrb.fadeout{
    animation:none;
    opacity:0;
    transition:opacity .5s ease;
  }
  @keyframes orbFloat{
    0%{   transform:scale(1); }
    14%{  transform:scale(1.08); }
    29%{  transform:scale(.92); }
    43%{  transform:scale(1.16); }
    58%{  transform:scale(.88); }
    72%{  transform:scale(1.12); }
    86%{  transform:scale(.95); }
    100%{ transform:scale(1); }
  }
  @keyframes blobMorph{
    0%{   border-radius:58% 42% 55% 45% / 45% 55% 45% 55%; }
    20%{  border-radius:36% 64% 42% 58% / 62% 38% 68% 32%; }
    38%{  border-radius:64% 36% 30% 70% / 42% 58% 30% 70%; }
    55%{  border-radius:42% 58% 68% 32% / 68% 32% 55% 45%; }
    73%{  border-radius:66% 34% 46% 54% / 34% 66% 40% 60%; }
    88%{  border-radius:34% 66% 58% 42% / 58% 42% 64% 36%; }
    100%{ border-radius:58% 42% 55% 45% / 45% 55% 45% 55%; }
  }
  #introOrb .orb-colors{
    position:absolute;
    inset:-45%;
    background-image:
      radial-gradient(circle, var(--red) 0%, rgba(255,51,51,0) 62%),
      radial-gradient(circle, var(--indigo) 0%, rgba(49,57,251,0) 62%),
      radial-gradient(circle, var(--blue) 0%, rgba(0,71,255,0) 62%),
      radial-gradient(circle, var(--cream) 0%, rgba(255,250,221,0) 58%);
    background-repeat:no-repeat;
    background-size:65% 65%, 70% 70%, 68% 68%, 50% 50%;
    background-position:22% 30%, 72% 22%, 30% 76%, 66% 68%;
    animation:orbColorsDrift 6.5s ease-in-out infinite;
    opacity:.95;
  }
  @keyframes orbColorsDrift{
    0%{   background-position:22% 30%, 72% 22%, 30% 76%, 66% 68%; }
    25%{  background-position:42% 58%, 54% 42%, 56% 38%, 40% 54%; }
    50%{  background-position:72% 26%, 24% 70%, 66% 64%, 28% 30%; }
    75%{  background-position:46% 66%, 60% 30%, 34% 54%, 56% 44%; }
    100%{ background-position:22% 30%, 72% 22%, 30% 76%, 66% 68%; }
  }

  /* ---------- PHASE 2: full-screen animated gradient ---------- */
  #gradientBg{
    position:absolute;
    inset:0;
    z-index:2;
    clip-path:circle(0px at 50% 50%);
    background:linear-gradient(135deg, #10184a, #0047FF);
    overflow:hidden;
    transition:clip-path 1.05s cubic-bezier(.16,.84,.3,1);
  }
  #gradientBg.reveal{
    clip-path:circle(120% at 50% 50%);
  }
  #blobField{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .flow-blob{
    position:absolute;
    top:0; left:0;
    border-radius:50%;
    filter:blur(70px);
    opacity:0;
    pointer-events:none;
    mix-blend-mode:screen;
    will-change:transform, opacity;
  }
  /* ---------- LOGO (centered, slides up + unblurs) ---------- */
  #logoWrap{
    position:absolute;
    inset:0;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  #logoWrap img{
    width:84px;
    height:84px;
    display:block;
    opacity:0;
    transform:translateY(30px);
    filter:blur(16px) drop-shadow(0 6px 24px rgba(0,0,0,.25));
    transition:opacity .6s ease, transform .6s ease, filter .6s ease;
  }
  #logoWrap.show img{
    opacity:1;
    transform:translateY(0);
    filter:blur(0) drop-shadow(0 6px 24px rgba(0,0,0,.25));
  }
  #logoWrap.hide img{
    opacity:0;
    transform:translateY(-14px);
    filter:blur(10px);
    transition:opacity .35s ease, transform .35s ease, filter .35s ease;
  }

  /* ---------- HEADLINE (word-by-word rise + blur) ---------- */
  #headline{
    position:absolute;
    inset:0;
    z-index:6;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    text-align:center;
    padding:0 24px;
    pointer-events:none;
  }
  #headline h1{
    font-size:clamp(28px, 5.2vw, 48px);
    font-weight:800;
    line-height:1.14;
    color:var(--cream);
    letter-spacing:-.01em;
  }
  #headline .line{ display:block; }
  #headline .word{
    display:inline-block;
    opacity:0;
    transform:translateY(26px);
    filter:blur(12px);
    transition:opacity .55s ease, transform .55s ease, filter .55s ease;
  }
  #headline.show .word{
    opacity:1;
    transform:translateY(0);
    filter:blur(0);
  }
  #headline .word:nth-child(1){ transition-delay:0s; }
  #headline .line:nth-child(2) .word:nth-child(1){ transition-delay:.12s; }
  #headline .line:nth-child(2) .word:nth-child(2){ transition-delay:.24s; }

  #nextBtn{
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:var(--cream);
    color:var(--blue);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 20px rgba(0,0,0,.18);
    opacity:0;
    transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, box-shadow .25s ease, background .25s ease;
    pointer-events:none;
  }
  #headline.show-btn #nextBtn{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  #nextBtn:hover{
    transform:translateY(-3px) scale(1.04);
  }
  #nextBtn:active{
    transform:translateY(0) scale(.95);
  }
  #nextBtn svg{ width:20px; height:20px; }

  /* ---------- PLACEHOLDER SITE BEHIND ---------- */
  #site{
    position:fixed;
    inset:0;
    z-index:1;
    background:#0b0b10;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--cream);
    text-align:center;
    padding:24px;
  }
  #site p{
    max-width:480px;
    opacity:.6;
    font-size:14px;
    line-height:1.6;
  }

  /* ---------- LOGIN SCREEN (nền blob vẫn giữ nguyên phía sau) ---------- */
  #loginScreen{
    position:absolute;
    inset:0;
    z-index:7;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    opacity:0;
    transition:opacity .5s ease;
  }
  #loginScreen.show{
    display:flex;
    opacity:1;
  }
  #loginScreen .login-logo{
    width:56px;
    height:56px;
    margin-bottom:18px;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.25));
  }
  #loginScreen h2{
    font-size:clamp(22px, 3.2vw, 28px);
    font-weight:800;
    color:var(--cream);
    margin-bottom:8px;
  }
  #loginScreen .login-sub{
    font-size:14px;
    color:rgba(255,250,221,.7);
    max-width:320px;
    line-height:1.5;
    margin-bottom:30px;
  }
  .google-btn{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:var(--black);
    background:var(--cream);
    border:none;
    border-radius:999px;
    padding:13px 26px;
    cursor:pointer;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .google-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(255,250,221,.18);
  }
  .google-btn:active{
    transform:translateY(0) scale(.97);
  }

  @media (prefers-reduced-motion: reduce){
    #introOrb, #introOrb .orb-colors, .flow-blob, .start-orb{ animation:none !important; }
  }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Đã đăng nhập sẵn (session còn hạn) -> khỏi xem lại welcome, vào thẳng trang chính.
  cm_ensureCookieSynced().then(session => {
    if (session) window.location.href = '/';
  });

  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');

  // Cloudflare Turnstile gọi hàm này (qua data-callback) kèm token khi user pass check.
  // Không tin token mù quáng — gửi lên Pages Function để verify thật với Cloudflare trước khi mở khoá nút.
  function onTurnstileVerified(token) {
    fetch('/api/verify-turnstile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          startBtn.classList.add('ready');
        } else if (window.turnstile) {
          turnstile.reset('#cfTurnstileWidget');
        }
      })
      .catch(() => {
        if (window.turnstile) turnstile.reset('#cfTurnstileWidget');
      });
  }
  // Token hết hạn hoặc lỗi -> khoá lại nút, bắt check lại.
  function onTurnstileExpired() {
    startBtn.classList.remove('ready');
  }

  const introOrb = document.getElementById('introOrb');
  const gradientBg = document.getElementById('gradientBg');
  const logoWrap = document.getElementById('logoWrap');
  const headline = document.getElementById('headline');
  const nextBtn = document.getElementById('nextBtn');
  const stage = document.getElementById('stage');
  const audio = document.getElementById('bgAudio');

  const EXPAND_AT   = 5200;   // orb -> full-screen gradient + logo in
  const SWAP_AT     = 8000;   // logo -> headline words
  const WORDS_DUR   = 900;    // time for the last word to finish rising
  const BTN_AFTER   = 250;    // extra pause before the arrow button appears

  // ---------- Phase 2: flowing blob field ----------
  const blobField = document.getElementById('blobField');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const BLOB_COLORS = [
    '#0B1F6B', '#141B8C', '#1E2FAE', '#3139FB', '#0047FF',
    '#2C6FF0', '#3D8BFF', '#5EC8FF', '#00B8D4', '#FF3333'
  ];
  const RED_INDEX = BLOB_COLORS.length - 1;
  const MAX_BLOBS = 7;
  let blobFieldRunning = false;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function pickColor(){
    // red is a rare accent (~1 in 9 picks)
    if (Math.random() < 0.11) return BLOB_COLORS[RED_INDEX];
    return BLOB_COLORS[Math.floor(rand(0, RED_INDEX))];
  }

  function spawnBlob(initialDelay, seedProgress){
    if (!blobFieldRunning) return;

    const el = document.createElement('div');
    el.className = 'flow-blob';

    const size = rand(38, 70);          // vmax
    const startX = rand(-10, 110);       // vw
    const startY = rand(-10, 110);       // vh
    const angle = rand(0, 360) * Math.PI / 180;
    const travel = rand(85, 130);        // vmax
    const dx = Math.cos(angle) * travel;
    const dy = Math.sin(angle) * travel;
    const duration = rand(8000, 15000);
    const peakOpacity = rand(.55, .85);

    el.style.width = size + 'vmax';
    el.style.height = size + 'vmax';
    el.style.left = startX + 'vw';
    el.style.top = startY + 'vh';
    el.style.background = pickColor();

    blobField.appendChild(el);

    const run = () => {
      const anim = el.animate([
        { transform:'translate(-50%,-50%) translate(0,0) scale(.55)', opacity:0 },
        { transform:'translate(-50%,-50%) translate(0,0) scale(1)', opacity:peakOpacity, offset:.18 },
        { transform:`translate(-50%,-50%) translate(${dx}vmax,${dy}vmax) scale(1.1)`, opacity:peakOpacity, offset:.82 },
        { transform:`translate(-50%,-50%) translate(${dx*1.18}vmax,${dy*1.18}vmax) scale(1.18)`, opacity:0 }
      ], { duration, easing:'ease-in-out', fill:'forwards' });

      // seed some blobs already mid-flight so the reveal doesn't look empty
      if (seedProgress) anim.currentTime = duration * seedProgress;

      anim.onfinish = () => {
        el.remove();
        if (blobFieldRunning) spawnBlob(0);
      };
    };

    if (initialDelay) setTimeout(run, initialDelay);
    else run();
  }

  function startBlobField(){
    if (reduceMotion || blobFieldRunning) return;
    blobFieldRunning = true;

    const SEEDED = 3; // blobs that appear already mid-flight right at reveal
    for (let i = 0; i < SEEDED; i++){
      spawnBlob(0, rand(0.25, 0.6));
    }
    for (let i = SEEDED; i < MAX_BLOBS; i++){
      spawnBlob(rand(0, 3000)); // stagger the rest so it fills in gradually
    }
  }

  startBtn.addEventListener('click', () => {
    // Tắt hẳn tương tác của startBtn ngay lập tức: class "ready" tự set
    // pointer-events:auto trên chính nó, nên riêng pointer-events:none của
    // #startOverlay.hide (ở phần tử cha) không đủ để chặn click xuyên qua nó.
    // Nếu không gỡ ở đây, nút này vẫn "vô hình nhưng bấm được" và đè lên
    // đúng vị trí của #nextBtn ở màn hình sau, khiến bấm mũi tên lại chạy
    // nhầm handler của startBtn (phát lại audio) thay vì mở màn đăng nhập.
    startBtn.classList.remove('ready');
    startBtn.disabled = true;
    startOverlay.classList.add('hide');

    audio.currentTime = 0;
    audio.play().catch(()=>{});

    // Phase 1: blended colors breathing on black
    introOrb.classList.add('breathe');

    // Phase 2: expand + reveal animated gradient + logo rises in
    setTimeout(() => {
      introOrb.classList.remove('breathe');
      introOrb.classList.add('fadeout');

      gradientBg.classList.add('reveal');
      gradientBg.classList.add('animate');
      startBlobField();

      logoWrap.classList.add('show');
    }, EXPAND_AT);

    // Phase 3: logo out, headline words rise in one by one
    setTimeout(() => {
      logoWrap.classList.remove('show');
      logoWrap.classList.add('hide');
      headline.classList.add('show');

      // arrow button appears only after the words finish rising
      setTimeout(() => {
        headline.classList.add('show-btn');
      }, WORDS_DUR + BTN_AFTER);
    }, SWAP_AT);
  });

  const loginScreen = document.getElementById('loginScreen');
  const googleBtn = document.getElementById('googleBtn');

  nextBtn.addEventListener('click', () => {
    headline.classList.remove('show', 'show-btn');
    loginScreen.classList.add('show');
  });

  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/welcome.html' }
    });
    if (error) {
      googleBtn.disabled = false;
      alert('Đăng nhập thất bại: ' + error.message);
    }
    // Nếu thành công, trình duyệt sẽ redirect sang Google rồi quay lại đây.
  });

  // Khi Supabase xử lý xong OAuth callback (code trong URL) và tạo session,
  // sự kiện SIGNED_IN sẽ bắn ra -> đồng bộ cookie xong thì vào trang chính.
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      window.location.href = '/';
    }
  });
</script>
